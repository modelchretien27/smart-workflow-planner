<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Workflow Planner — Dashboard SaaS</title>
    <style>
        :root {
            --primary: #2c3e50;
            --accent: #3498db;
            --success: #2ecc71;
            --bg: #f4f7f6;
            --card-bg: #ffffff;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
            background-color: var(--bg);
            color: #333;
        }

        header {
            background-color: var(--primary);
            color: white;
            padding: 20px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }

        header h1 {
            margin: 0;
            font-size: 1.5rem;
        }

        .api-badge {
            background-color: var(--accent);
            color: white;
            padding: 6px 12px;
            border-radius: 4px;
            text-decoration: none;
            font-size: 0.85rem;
            font-weight: bold;
        }

        .container {
            max-width: 1200px;
            margin: 30px auto;
            padding: 0 20px;
        }

        .grid {
            display: grid;
            grid-template-columns: 1fr 2fr;
            gap: 20px;
        }

        .card {
            background: var(--card-bg);
            padding: 25px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            margin-bottom: 20px;
        }

        .card h2 {
            margin-top: 0;
            color: var(--primary);
            font-size: 1.2rem;
            border-bottom: 2px solid #f0f0f0;
            padding-bottom: 10px;
        }

        .form-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            margin-bottom: 5px;
            font-weight: 600;
            font-size: 0.9rem;
        }

        input, select {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 5px;
            box-sizing: border-box;
            font-size: 0.95rem;
        }

        button {
            background-color: var(--accent);
            color: white;
            border: none;
            padding: 10px 18px;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
            width: 100%;
            font-size: 0.95rem;
            transition: background 0.2s;
        }

        button:hover {
            background-color: #2980b9;
        }

        .task-list, .dept-list {
            list-style: none;
            padding: 0;
            margin: 0;
        }

        .task-item {
            background: #fafafa;
            border: 1px solid #eee;
            padding: 15px;
            border-radius: 6px;
            margin-bottom: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .progress-bar-bg {
            background: #e0e0e0;
            border-radius: 10px;
            height: 12px;
            width: 150px;
            overflow: hidden;
            margin-top: 5px;
        }

        .progress-bar-fill {
            background: var(--success);
            height: 100%;
            width: 0%;
            transition: width 0.3s;
        }

        .tag {
            background: #e1f5fe;
            color: #0288d1;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 0.8rem;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <header>
        <h1>Smart Workflow Planner</h1>
        <a href="https://smart-workflow-planner-api.onrender.com/docs" target="_blank" class="api-badge">Documentation API Swagger ↗</a>
    </header>

    <div class="container">
        <div class="grid">
            
            <!-- Colonne de Gauche : Formulaires -->
            <div>
                <!-- Formulaire Département -->
                <div class="card">
                    <h2>Nouveau Département</h2>
                    <form id="deptForm">
                        <div class="form-group">
                            <label for="deptName">Nom du Département</label>
                            <input type="text" id="deptName" placeholder="ex: IT & Développements" required>
                        </div>
                        <button type="submit">Créer le Département</button>
                    </form>
                </div>

                <!-- Formulaire Tâche -->
                <div class="card">
                    <h2>Nouvelle Tâche</h2>
                    <form id="taskForm">
                        <div class="form-group">
                            <label for="taskTitle">Intitulé de la Tâche</label>
                            <input type="text" id="taskTitle" placeholder="ex: Audit sécurité API" required>
                        </div>
                        <div class="form-group">
                            <label for="taskDept">Département Attribué</label>
                            <select id="taskDept" required>
                                <option value="">-- Sélectionner un département --</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label for="taskProgress">Avancement (%)</label>
                            <input type="number" id="taskProgress" min="0" max="100" value="0" required>
                        </div>
                        <button type="submit">Ajouter la Tâche</button>
                    </form>
                </div>
            </div>

            <!-- Colonne de Droite : Vue d'Ensemble des Activités -->
            <div>
                <div class="card">
                    <h2>Tableau de Bord des Tâches & Avancements</h2>
                    <div id="loading" style="display:none;">Chargement des données...</div>
                    <div id="taskList" class="task-list"></div>
                </div>
            </div>

        </div>
    </div>

    <script>
        const API_URL = "https://smart-workflow-planner-api.onrender.com";

        // Initialisation
        document.addEventListener("DOMContentLoaded", () => {
            loadDepartments();
            loadTasks();
        });

        // Charger les départements
        async function loadDepartments() {
            try {
                const res = await fetch(`${API_URL}/departments/`);
                const depts = await res.json();
                
                const select = document.getElementById("taskDept");
                select.innerHTML = '<option value="">-- Sélectionner un département --</option>';
                
                depts.forEach(d => {
                    const option = document.createElement("option");
                    option.value = d.id;
                    option.textContent = d.name;
                    select.appendChild(option);
                });
            } catch (err) {
                console.error("Erreur lors du chargement des départements :", err);
            }
        }

        // Charger les tâches
        async function loadTasks() {
            try {
                const res = await fetch(`${API_URL}/tasks/`);
                const tasks = await res.json();
                
                const taskList = document.getElementById("taskList");
                taskList.innerHTML = "";

                if (tasks.length === 0) {
                    taskList.innerHTML = "<p>Aucune tâche enregistrée pour le moment.</p>";
                    return;
                }

                tasks.forEach(t => {
                    const item = document.createElement("div");
                    item.className = "task-item";
                    item.innerHTML = `
                        <div>
                            <strong>${t.title}</strong>
                            <div class="progress-bar-bg">
                                <div class="progress-bar-fill" style="width: ${t.progress}%"></div>
                            </div>
                        </div>
                        <div style="text-align: right;">
                            <span class="tag">${t.progress}% complété</span>
                        </div>
                    `;
                    taskList.appendChild(item);
                });
            } catch (err) {
                console.error("Erreur lors du chargement des tâches :", err);
            }
        }

        // Créer un département
        document.getElementById("deptForm").addEventListener("submit", async (e) => {
            e.preventDefault();
            const name = document.getElementById("deptName").value;

            await fetch(`${API_URL}/departments/`, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ name })
            });

            document.getElementById("deptName").value = "";
            loadDepartments();
        });

        // Créer une tâche
        document.getElementById("taskForm").addEventListener("submit", async (e) => {
            e.preventDefault();
            const title = document.getElementById("taskTitle").value;
            const department_id = parseInt(document.getElementById("taskDept").value);
            const progress = parseFloat(document.getElementById("taskProgress").value);

            await fetch(`${API_URL}/tasks/`, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ title, department_id, progress })
            });

            document.getElementById("taskTitle").value = "";
            document.getElementById("taskProgress").value = "0";
            loadTasks();
        });
    </script>

</body>
</html>
